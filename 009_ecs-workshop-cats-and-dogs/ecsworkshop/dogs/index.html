<!DOCTYPE html>
<html>
<head>
<title>jujin! Welcome to Cats and Dogs DemoGo!!!!!</title>
<style>
    body {
            font-family: Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 20pt;
            text-transform: uppercase;
            text-align: center;
            background: #4c724c;
            color: white;
    }
</style>
</head>
<h1>2sub,This is what happiness looks like!sunny</h1>
<script language = "javascript">
        var imgArray = new Array();
        var bucket = "https://ecs-demogo-pictures.s3.ap-northeast-2.amazonaws.com/dog/";
        var format = ".jpeg";
        for (var i = 0; i < 11; i++) {
            imgArray[i] = bucket + i + format;
        }
        function showImage() {
            var objImg = document.getElementById("introImg");
            var imgNum = Math.floor(Math.random() * imgArray.length);
            objImg.src = imgArray[imgNum];
            objImg.onerror = function () {
                if (this.dataset.fallback !== "true") {
                    this.dataset.fallback = "true";
                    this.src = "https://placedog.net/640/480";
                }
            };
        }
    </script>
<body onload = "showImage()">
        <img id = "introImg" border="0" alt="Dog">
    </body>
</html>
